name: Update Play Store Hunter

on:
  schedule:
    - cron: '0 */6 * * *' # هر 6 ساعت یک بار
  workflow_dispatch: # دکمه اجرای دستی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository 🛎️
        uses: actions/checkout@v3

      - name: Set up Python 🐍
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies 📦
        run: |
          pip install requests google-play-scraper

      - name: Run Play Scraper 👾
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          python scraper.py

      - name: Commit and Push 🚀
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add categories/ last_update.json
          
          git diff --staged --quiet || (git commit -m "🤖 Auto-update App lists: $(date +'%Y-%m-%d %H:%M')" && git push)
